# Shared Railway config for this monorepo.
# Do NOT set dockerfilePath here — it would force every service to use the same image.
#
# In the Railway dashboard, set per service:
#   api  → Build: Dockerfile path = Dockerfile.api
#         Deploy: healthcheck path = /healthz
#   web  → Build: Dockerfile path = Dockerfile.web
#         Deploy: no /healthz healthcheck (or use /)
#         Variable: NEXT_PUBLIC_API_URL = https://<your-api-domain>
#
# Postgres plugin → provides DATABASE_URL to the api service.

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
